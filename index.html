<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechNova CI/CD Monitoring Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    background:#1e293b;
    padding:20px;
    text-align:center;
}

header h1{
    color:#38bdf8;
}

.container{
    width:90%;
    margin:40px auto;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.status{
    color:#22c55e;
    font-size:20px;
    font-weight:bold;
}

footer{
    margin-top:50px;
    text-align:center;
    padding:20px;
    background:#1e293b;
}

button{
    margin-top:20px;
    padding:10px 20px;
    background:#0ea5e9;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0284c7;
}
</style>

</head>

<body>

<header>
<h1>TechNova CI/CD Monitoring Dashboard</h1>
<p>AWS • Jenkins • Grafana • CloudWatch</p>
</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>Pipeline Status</h2>
<p class="status">SUCCESS</p>
</div>

<div class="card">
<h2>Latest Build</h2>
<p>#1</p>
</div>

<div class="card">
<h2>Deployment</h2>
<p>Completed</p>
</div>

<div class="card">
<h2>Server</h2>
<p>Running</p>
</div>

<div class="card">
<h2>Monitoring</h2>
<p>Grafana Active</p>
</div>

<div class="card">
<h2>Notifications</h2>
<p>Email Enabled</p>
</div>

</div>

<center>
<button onclick="checkStatus()">
Check Pipeline Status
</button>

<p id="demo" style="margin-top:20px;font-size:18px;"></p>
</center>

</div>

<footer>
TechNova DevOps Project © 2026
</footer>

<script>

function checkStatus(){

document.getElementById("demo").innerHTML=
"Jenkins Pipeline Executed Successfully ✔";

}

console.log("TechNova Dashboard Loaded");

</script>

</body>
</html>
